services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: foundryos-api
    restart: always
    expose:
      - "8787"
    environment:
      - PORT=8787
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-file:/app/data/foundry.db}
      - MASTER_ADMIN_SECRET=${MASTER_ADMIN_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_STARTER=${STRIPE_PRICE_STARTER}
      - STRIPE_PRICE_GROWTH=${STRIPE_PRICE_GROWTH}
      - STRIPE_PRICE_ENTERPRISE=${STRIPE_PRICE_ENTERPRISE}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
    volumes:
      - ./data:/app/data

  caddy:
    image: caddy:2-alpine
    container_name: foundryos-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./dist:/srv
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
